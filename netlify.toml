# Publica a raiz do repositório, sem build.
[build]
  publish = "."

# Arquivos do repositório que não devem aparecer no site
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

# /admin abre o painel
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# O painel não deve ser indexado
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Cache longo pros ícones e imagem de compartilhamento
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
